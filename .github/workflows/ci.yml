name: CI

# Branch/PR pushes only run test verification.
# Pushing a tag like v1.0.0 runs tests first, then publishes to npm
# and attaches single-binary builds to the GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck / build / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

  publish:
    name: publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-bin:
    name: compile binary (${{ matrix.suffix }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            suffix: linux-x64
          - target: bun-linux-arm64
            suffix: linux-arm64
          - target: bun-darwin-x64
            suffix: darwin-x64
          - target: bun-darwin-arm64
            suffix: darwin-arm64
          - target: bun-windows-x64
            suffix: windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: npm ci

      - name: Compile
        # @aws-sdk/client-s3 is an optional peer of unzipper, only required for
        # S3 extraction which db2gram never uses. Kept external so bundling succeeds.
        run: bun build --compile --external @aws-sdk/client-s3 --target=${{ matrix.target }} --outfile dist/bin/db2gram-${{ matrix.suffix }} src/cli.ts

      - name: Smoke test (native target only)
        if: matrix.suffix == 'linux-x64'
        run: ./dist/bin/db2gram-linux-x64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: db2gram-${{ matrix.suffix }}
          path: dist/bin/db2gram-${{ matrix.suffix }}

  release:
    name: attach binaries to GitHub Release
    needs: build-bin
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
          merge-multiple: true

      - run: chmod +x dist/bin/db2gram-linux-* dist/bin/db2gram-darwin-* || true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/bin/*
          generate_release_notes: true

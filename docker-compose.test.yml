# Throwaway servers for `npm run test:integration`.
# Equivalent to scripts/test-integration.sh but usable manually.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db2gram_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: db2gram_test
      MARIADB_USER: db2gram
      MARIADB_PASSWORD: db2gram
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-uroot", "-proot"]
      interval: 2s
      timeout: 3s
      retries: 30
